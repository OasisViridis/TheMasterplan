name: 复杂任务
description: 为跨模块、较大范围或存在歧义的工作记录完整任务边界
title: "[复杂任务] "
body:
  - type: markdown
    attributes:
      value: |
        此表单用于 `AGENTS.md` 定义的复杂任务路径，不改变权威顺序或批准规则。父 Issue 的唯一 Assignee 是协调人；执行 Issue 的唯一 Assignee 是执行者。并行交付拆为子 Issue。分类使用 bug / enhancement，准备状态按 Core Workflow 设置；ready-for-agent 不证明依赖满足或认领成功。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 描述本任务要达成的单一、可验证结果。
      placeholder: 完成后，使用者能够……
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 列出本任务包含的工作、允许修改的区域以及必须保持不变的边界。
      placeholder: |
        - 包含：
        - 允许修改：
        - 必须保持不变：
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收条件
      description: 使用可检查的条目说明何时可以认为任务完成。
      placeholder: |
        - [ ] 条件一
        - [ ] 条件二
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: 排除项
      description: 明确本任务不会实现、不会修改或留待后续处理的内容。
      placeholder: |
        - 不包含：
        - 留待后续：
    validations:
      required: true

  - type: textarea
    id: dependencies_order
    attributes:
      label: 依赖与执行顺序
      description: 使用原生 Blocked by / Blocking，并说明具体所需结果；上游 PR 合入 main 且结果验收后下游才可认领开工，关闭 Issue 本身不足为证。没有依赖填“无”。
      placeholder: |
        - 原生阻塞 Issue：
        - 所需结果 / 合并提交 / 验收证据：
    validations:
      required: true

  - type: textarea
    id: collaboration
    attributes:
      label: 协作分工与交接
      description: 记录模式、父/执行 Issue 归属、文件边界和授权。未参与实现的另一 Agent 会话可技术审阅，人类单独批准。角色待定写待指派；释放任务须先停止写入作业、留下交接，再清空执行 Assignee。
      placeholder: |
        - 模式：团队 / 单人
        - 父 Issue / 当前协调人：无 / 链接与 Assignee
        - 执行 Issue / 唯一 Assignee / 文件边界 / worktree / ref：
        - 共享接口、类型或逻辑的修改归属：无 / Issue
        - 独立技术审阅者（人或 Agent 会话）：待指派
        - 非 PR 作者的人类批准人 / 原生 review 证据：待指派
        - 有权决策角色与授权来源：
        - 交接记录：无 / 链接
    validations:
      required: true

  - type: checkboxes
    id: authority_boundary
    attributes:
      label: 权限边界确认
      description: 创建 Issue 只记录任务边界，不构成下列操作的授权。
      options:
        - label: 我确认 merge、release、远端数据删除、破坏性操作和范围扩大仍需人类另行明确决定。
          required: true
